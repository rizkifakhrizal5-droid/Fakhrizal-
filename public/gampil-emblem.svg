<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="100%" height="100%">
  <!-- GAMPIL Official Emblem Vector based on IMG_0077.png -->
  <g fill="none" stroke="#1e245a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Outer Hexagonal Silhouette Shadow & Base -->
    
    <!-- LEFT TOWER -->
    <!-- Left Navy Facet -->
    <path d="M 28 85 L 118 32 L 118 135 L 28 185 Z" fill="#252c6a" />
    <path d="M 28 185 L 118 135 L 118 310 L 28 250 Z" fill="#252c6a" />
    
