<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Deep Space 3D Sphere / Plaque Gradients -->
    <radialGradient id="sphere3d" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="25%" stop-color="#2563eb"/>
      <stop offset="65%" stop-color="#1d4ed8"/>
      <stop offset="85%" stop-color="#0f2b6b"/>
      <stop offset="100%" stop-color="#050d24"/>
    </radialGradient>

    <!-- Metallic Gold 3D Extrusion & Bevel Gradients -->
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- 3D Bevel Top-Left Light Angle -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- 3D Bevel Dark Bottom-Right Angle -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <linearGradient id="goldRoof3d" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Pillar 3D Cylindrical Marble -->
    <linearGradient id="pillarCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="18%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Portal Glow -->
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#08142c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. BASE VOLUMETRIC 3D MEDALLION (Pure vector geometry without fragile filter reliance) -->
  <!-- Deep 3D Drop Shadow Layers -->
  <rect x="14" y="28" width="228" height="220" rx="60" fill="#020617" opacity="0.45"/>
  <rect x="14" y="24" width="228" height="222" rx="60" fill="#03071e" opacity="0.6"/>

  <!-- Physical 3D Extruded Bottom Thickness (Dark Bronze/Gold Extrusion) -->
  <rect x="14" y="20" width="228" height="222" rx="60" fill="url(#goldDark)"/>
  <rect x="14" y="16" width="228" height="224" rx="60" fill="#92400e"/>

  <!-- Outer Metallic 3D Beveled Gold Border -->
  <rect x="14" y="12" width="228" height="224" rx="60" fill="url(#goldBevel)"/>
  
  <!-- Inner Bevel Shadow Lip -->
  <rect x="18" y="16" width="220" height="216" rx="56" fill="#451a03"/>
  <rect x="20" y="18" width="216" height="212" rx="54" fill="#050d24"/>

  <!-- Inner Sphere Royal Blue Body with Rich 3D Gradient -->
  <rect x="22" y="20" width="212" height="208" rx="52" fill="url(#sphere3d)"/>

  <!-- 3D Specular Glass Dome Curve (Top Gloss Highlight) -->
  <path d="M 32 64 C 32 34, 72 24, 128 24 C 184 24, 224 34, 224 64 C 224 92, 172 80, 128 80 C 84 80, 32 92, 32 64 Z" fill="#ffffff" opacity="0.28"/>
  <ellipse cx="76" cy="42" rx="30" ry="12" fill="#ffffff" opacity="0.32" transform="rotate(-12, 76, 42)"/>
  
  <!-- Inner Rim Metallic Glint Line -->
  <rect x="24" y="22" width="208" height="204" rx="50" fill="none" stroke="#93c5fd" stroke-width="1.8" opacity="0.6"/>

  <!-- 2. ARCHITECTURAL 3D PALACE / MAL PELAYANAN PUBLIK FACADE -->
  <g transform="translate(0, -2)">
    <!-- Triangular Roof Pediment Deep Vector Shadow -->
    <polygon points="128,38 216,88 40,88" fill="#020617" opacity="0.55"/>
    
    <!-- Roof 3D Lower Edge Bevel -->
    <polygon points="128,37 213,85 43,85" fill="#451a03"/>
    
    <!-- Main 3D Golden Roof Pediment -->
    <polygon points="128,32 211,82 45,82" fill="url(#goldRoof3d)"/>
    <!-- Specular Highlight on Left Ridge of Pediment -->
    <line x1="128" y1="32" x2="45" y2="82" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
    
    <!-- Roof Inner Inset Pediment -->
    <polygon points="128,43 194,77 62,77" fill="#0f2b6b" stroke="url(#goldBevel)" stroke-width="2.5"/>

    <!-- 3D Golden Star of Excellence in Pediment Center -->
    <!-- Star Shadow -->
    <polygon points="128,52 133,60 143,61 135,68 138,77 128,72 118,77 121,68 113,61 123,60" fill="#020617" opacity="0.6"/>
    <!-- Star Front -->
    <polygon points="128,50 132,59 142,60 134,67 137,76 128,71 119,76 122,67 114,60 124,59" fill="url(#goldLight)"/>

    <!-- Roof 3D Architrave Beam / Entablature (Golden Slab) -->
    <!-- Lower Depth Extrusion -->
    <rect x="36" y="87" width="184" height="5" rx="1.5" fill="#451a03"/>
    <!-- Main Beam -->
    <rect x="36" y="82" width="184" height="9" rx="2" fill="url(#goldBevel)"/>
    <!-- Specular Highlight Line on Beam -->
    <line x1="37" y1="83" x2="219" y2="83" stroke="#ffffff" stroke-width="2" opacity="0.95"/>

    <!-- 4 Classic Volumetric 3D Pillars (Pelayanan Publik Terpadu) -->
    <!-- Pillar 1 -->
    <g transform="translate(50, 91)">
      <!-- Capital Top -->
      <rect x="-3" y="0" width="26" height="6" rx="2" fill="url(#goldBevel)"/>
      <!-- Cylindrical Shaft -->
      <rect x="0" y="5" width="20" height="64" rx="3" fill="url(#pillarCylinder)"/>
      <!-- Flute Highlight Line -->
      <line x1="10" y1="6" x2="10" y2="68" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
      <!-- Base Bottom -->
      <rect x="-3" y="68" width="26" height="7" rx="2" fill="url(#goldBevel)"/>
      <rect x="-5" y="74" width="30" height="4" rx="1.5" fill="#1e293b"/>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(93, 91)">
      <rect x="-3" y="0" width="26" height="6" rx="2" fill="url(#goldBevel)"/>
      <rect x="0" y="5" width="20" height="64" rx="3" fill="url(#pillarCylinder)"/>
      <line x1="10" y1="6" x2="10" y2="68" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
      <rect x="-3" y="68" width="26" height="7" rx="2" fill="url(#goldBevel)"/>
      <rect x="-5" y="74" width="30" height="4" rx="1.5" fill="#1e293b"/>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(143, 91)">
      <rect x="-3" y="0" width="26" height="6" rx="2" fill="url(#goldBevel)"/>
      <rect x="0" y="5" width="20" height="64" rx="3" fill="url(#pillarCylinder)"/>
      <line x1="10" y1="6" x2="10" y2="68" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
      <rect x="-3" y="68" width="26" height="7" rx="2" fill="url(#goldBevel)"/>
      <rect x="-5" y="74" width="30" height="4" rx="1.5" fill="#1e293b"/>
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(186, 91)">
      <rect x="-3" y="0" width="26" height="6" rx="2" fill="url(#goldBevel)"/>
      <rect x="0" y="5" width="20" height="64" rx="3" fill="url(#pillarCylinder)"/>
      <line x1="10" y1="6" x2="10" y2="68" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
      <rect x="-3" y="68" width="26" height="7" rx="2" fill="url(#goldBevel)"/>
      <rect x="-5" y="74" width="30" height="4" rx="1.5" fill="#1e293b"/>
    </g>

    <!-- Welcoming Center Arched Gateway of MPP -->
    <path d="M 112 165 L 112 118 C 112 104, 144 104, 144 118 L 144 165 Z" fill="#020817"/>
    <path d="M 114 165 L 114 120 C 114 108, 142 108, 142 120 L 142 165 Z" fill="url(#portalGlow)"/>
    <circle cx="128" cy="122" r="7" fill="#fef08a" opacity="0.95"/>

    <!-- 3-Tiered 3D Pedestal Base / Steps -->
    <!-- Tier 1 -->
    <rect x="32" y="168" width="192" height="8" rx="2" fill="url(#pillarCylinder)"/>
    <line x1="33" y1="169" x2="223" y2="169" stroke="#ffffff" stroke-width="1.8"/>
    <!-- Tier 2 -->
    <rect x="26" y="176" width="204" height="9" rx="2.5" fill="#334155"/>
    <line x1="27" y1="177" x2="229" y2="177" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Tier 3 Base Slab -->
    <rect x="20" y="184" width="216" height="11" rx="3" fill="#0f172a"/>
  </g>

  <!-- 3. PROMINENT 3D EMBOSSED "MPP" PLAQUE AT BOTTOM -->
  <g transform="translate(128, 208)">
    <!-- 3D Plaque Shadow -->
    <rect x="-76" y="-14" width="152" height="38" rx="19" fill="#020617" opacity="0.6"/>
    <!-- 3D Plaque Base Extrusion -->
    <rect x="-76" y="-17" width="152" height="36" rx="18" fill="#451a03"/>
    <!-- 3D Plaque Body -->
    <rect x="-74" y="-19" width="148" height="36" rx="18" fill="#030818" stroke="url(#goldBevel)" stroke-width="3"/>
    <!-- Inner Gloss Reflection -->
    <rect x="-71" y="-17" width="142" height="16" rx="8" fill="#ffffff" opacity="0.18"/>
    
    <!-- 3D Text "MPP" with physical vector depth -->
    <!-- Deep Shadow -->
    <text x="0" y="9" 
          font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" 
          font-size="24" 
          font-weight="900" 
          letter-spacing="5" 
          text-anchor="middle" 
          fill="#1c0a02">
      MPP
    </text>
    <!-- Mid Extrusion Layer -->
    <text x="0" y="7" 
          font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" 
          font-size="24" 
          font-weight="900" 
          letter-spacing="5" 
          text-anchor="middle" 
          fill="#92400e">
      MPP
    </text>
    <!-- Front Bright Golden Face -->
    <text x="0" y="4" 
          font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" 
          font-size="24" 
          font-weight="900" 
          letter-spacing="5" 
          text-anchor="middle" 
          fill="url(#goldLight)">
      MPP
    </text>
  </g>

  <!-- Golden 3D Shimmer Sparkles in Corners -->
  <polygon points="46,38 48,43 53,44 48,46 46,51 44,46 39,44 44,43" fill="#fef08a" opacity="0.95"/>
  <polygon points="210,38 212,43 217,44 212,46 210,51 208,46 203,44 208,43" fill="#fef08a" opacity="0.95"/>
</svg>
