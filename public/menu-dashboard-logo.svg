<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Admin: Deep Midnight Navy & Indigo -->
    <linearGradient id="adminMppBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Metallic Gold 3D -->
    <linearGradient id="goldMppAdmin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Chart Bar Gradients -->
    <linearGradient id="chartBar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="chartBar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="chartBar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="chartBar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="adminDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 3D Beveled Plaque Container -->
  <g filter="url(#adminDropShadow)">
    <rect x="6" y="6" width="108" height="108" rx="28" fill="#050816"/>
    <rect x="7" y="7" width="106" height="106" rx="26" fill="url(#adminMppBg)"/>
    <rect x="8.5" y="8.5" width="103" height="103" rx="24.5" fill="none" stroke="url(#goldMppAdmin)" stroke-width="2" opacity="0.95"/>
    <path d="M 12 30 Q 60 12 108 30 L 108 55 Q 60 42 12 55 Z" fill="#ffffff" opacity="0.08"/>
  </g>

  <!-- 3D MPP Admin Screen with 3D Pediment Header -->
  <g transform="translate(0, 0)">
    <!-- 3D Gold Pediment Roof (Crown of MPP) -->
    <polygon points="60,18 96,38 24,38" fill="#78350f"/>
    <polygon points="60,16 94,36 26,36" fill="url(#goldMppAdmin)"/>
    <!-- Inset Triangle -->
    <polygon points="60,21 86,34 34,34" fill="#0f172a"/>

    <!-- Star Emblem in Pediment -->
    <polygon points="60,24 61.5,28 66,28.5 62.5,31.5 63.5,36 60,33.5 56.5,36 57.5,31.5 54,28.5 58.5,28" fill="#fef08a"/>

    <!-- Architrave Beam -->
    <rect x="22" y="36" width="76" height="5" rx="1" fill="url(#goldMppAdmin)"/>

    <!-- High-tech 3D Analytics Display Frame -->
    <rect x="24" y="43" width="72" height="42" rx="7" fill="#090d1a" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Screen Header dots -->
    <circle cx="31" cy="48" r="1.5" fill="#f43f5e"/>
    <circle cx="36" cy="48" r="1.5" fill="#f59e0b"/>
    <circle cx="41" cy="48" r="1.5" fill="#10b981"/>

    <!-- 3D Holographic Chart Bars (Data Analitik MPP) -->
    <rect x="33" y="65" width="8" height="15" rx="1.5" fill="url(#chartBar1)"/>
    <rect x="45" y="58" width="8" height="22" rx="1.5" fill="url(#chartBar2)"/>
    <rect x="57" y="53" width="8" height="27" rx="1.5" fill="url(#chartBar3)"/>
    <rect x="69" y="61" width="8" height="19" rx="1.5" fill="url(#chartBar4)"/>

    <!-- Trend line overlay -->
    <path d="M 37 63 L 49 56 L 61 51 L 73 59" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="61" cy="51" r="2" fill="#fbbf24"/>
  </g>

  <!-- 3D "MPP" Monogram Pill at Bottom -->
  <g transform="translate(60, 100)">
    <rect x="-36" y="-10" width="72" height="18" rx="9" fill="#020617" stroke="url(#goldMppAdmin)" stroke-width="1.5"/>
    <text x="0" y="3" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="13" 
          font-weight="900" 
          letter-spacing="3" 
          text-anchor="middle" 
          fill="url(#goldMppAdmin)">
      MPP
    </text>
  </g>
</svg>
