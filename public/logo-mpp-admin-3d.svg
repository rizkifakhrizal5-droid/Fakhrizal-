<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 12 100 98" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold 3D -->
    <linearGradient id="goldMppAdmin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Chart Bar Gradients -->
    <linearGradient id="chartBar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="chartBar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="chartBar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="chartBar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- PURE TRANSPARENT BACKGROUND (No rectangular plaque container) -->
  <g transform="translate(0, 0)">
    <!-- 3D Gold Pediment Roof (Crown of MPP) -->
    <polygon points="60,18 96,38 24,38" fill="#451a03"/>
    <polygon points="60,16 94,36 26,36" fill="url(#goldMppAdmin)"/>
    <line x1="60" y1="16" x2="26" y2="36" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

    <!-- Inset Triangle -->
    <polygon points="60,21 86,34 34,34" fill="#0f172a" stroke="url(#goldMppAdmin)" stroke-width="1.2"/>

    <!-- Star Emblem in Pediment -->
    <polygon points="60,24 61.5,28 66,28.5 62.5,31.5 63.5,36 60,33.5 56.5,36 57.5,31.5 54,28.5 58.5,28" fill="#fef08a"/>

    <!-- Architrave Beam -->
    <rect x="22" y="36" width="76" height="5" rx="1" fill="url(#goldMppAdmin)"/>

    <!-- High-tech 3D Analytics Display Frame -->
    <rect x="24" y="42" width="72" height="42" rx="7" fill="#090d1a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Screen Header dots -->
    <circle cx="31" cy="47" r="1.5" fill="#f43f5e"/>
    <circle cx="36" cy="47" r="1.5" fill="#f59e0b"/>
    <circle cx="41" cy="47" r="1.5" fill="#10b981"/>

    <!-- 3D Holographic Chart Bars (Data Analitik MPP) -->
    <rect x="33" y="64" width="8" height="15" rx="1.5" fill="url(#chartBar1)"/>
    <rect x="45" y="57" width="8" height="22" rx="1.5" fill="url(#chartBar2)"/>
    <rect x="57" y="52" width="8" height="27" rx="1.5" fill="url(#chartBar3)"/>
    <rect x="69" y="60" width="8" height="19" rx="1.5" fill="url(#chartBar4)"/>

    <!-- Trend line overlay -->
    <path d="M 37 62 L 49 55 L 61 50 L 73 58" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="61" cy="50" r="2" fill="#fbbf24"/>
  </g>

  <!-- 3D "MPP" Monogram Pill at Bottom -->
  <g transform="translate(60, 98)">
    <rect x="-30" y="-8" width="60" height="17" rx="8.5" fill="#020617" stroke="url(#goldMppAdmin)" stroke-width="1.5"/>
    <text x="0" y="4" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="11" 
          font-weight="900" 
          letter-spacing="2.5" 
          text-anchor="middle" 
          fill="url(#goldMppAdmin)">
      MPP
    </text>
  </g>
</svg>
