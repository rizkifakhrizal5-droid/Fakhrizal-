<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 18 236 220" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold 3D Extrusion & Bevel Gradients -->
    <linearGradient id="transGoldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- 3D Bevel Top-Left Light Angle -->
    <linearGradient id="transGoldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- 3D Bevel Dark Bottom-Right Angle -->
    <linearGradient id="transGoldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <linearGradient id="transGoldRoof" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Pillar 3D Cylindrical Marble -->
    <linearGradient id="transPillarCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="18%" stop-color="#64748b"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Portal Glow -->
    <radialGradient id="transPortalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#08142c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- PURE TRANSPARENT BACKGROUND (No rectangular plaque, no solid box behind logo) -->
  <g transform="translate(0, 0)">
    <!-- Triangular Roof Pediment Deep Vector Shadow -->
    <polygon points="128,38 216,88 40,88" fill="#020617" opacity="0.4"/>
    
    <!-- Roof 3D Lower Edge Bevel -->
    <polygon points="128,37 213,85 43,85" fill="#451a03"/>
    
    <!-- Main 3D Golden Roof Pediment -->
    <polygon points="128,32 211,82 45,82" fill="url(#transGoldRoof)"/>
    <!-- Specular Highlight on Left Ridge of Pediment -->
    <line x1="128" y1="32" x2="45" y2="82" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
    
    <!-- Roof Inner Inset Pediment -->
    <polygon points="128,43 194,77 62,77" fill="#0f2b6b" stroke="url(#transGoldBevel)" stroke-width="2.5"/>

    <!-- 3D Golden Star of Excellence in Pediment Center -->
    <polygon points="128,52 133,60 143,61 135,68 138,77 128,72 118,77 121,68 113,61 123,60" fill="#020617" opacity="0.6"/>
    <polygon points="128,50 132,59 142,60 134,67 137,76 128,71 119,76 122,67 114,60 124,59" fill="url(#transGoldLight)"/>

    <!-- Roof 3D Architrave Beam / Entablature (Golden Slab) -->
    <rect x="36" y="87" width="184" height="5" rx="1.5" fill="#451a03"/>
    <rect x="36" y="82" width="184" height="9" rx="2" fill="url(#transGoldBevel)"/>
    <line x1="37" y1="83" x2="219" y2="83" stroke="#ffffff" stroke-width="2" opacity="0.95"/>

    <!-- 4 Classic Volumetric 3D Pillars -->
    <!-- Pillar 1 -->
    <g transform="translate(50, 91)">
      <rect x="-3" y="0" width="26" height="6" rx="2" fill="url(#transGoldBevel)"/>
      <rect x="0" y="5" width="20" height="64" rx="3" fill="url(#transPillarCylinder)"/>
      <line x1="10" y1="6" x2="10" y2="68" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
      <rect x="-3" y="68" width="26" height="7" rx="2" fill="url(#transGoldBevel)"/>
      <rect x="-5" y="74" width="30" height="4" rx="1.5" fill="#1e293b"/>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(93, 91)">
      <rect x="-3" y="0" width="26" height="6" rx="2" fill="url(#transGoldBevel)"/>
      <rect x="0" y="5" width="20" height="64" rx="3" fill="url(#transPillarCylinder)"/>
      <line x1="10" y1="6" x2="10" y2="68" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
      <rect x="-3" y="68" width="26" height="7" rx="2" fill="url(#transGoldBevel)"/>
      <rect x="-5" y="74" width="30" height="4" rx="1.5" fill="#1e293b"/>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(143, 91)">
      <rect x="-3" y="0" width="26" height="6" rx="2" fill="url(#transGoldBevel)"/>
      <rect x="0" y="5" width="20" height="64" rx="3" fill="url(#transPillarCylinder)"/>
      <line x1="10" y1="6" x2="10" y2="68" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
      <rect x="-3" y="68" width="26" height="7" rx="2" fill="url(#transGoldBevel)"/>
      <rect x="-5" y="74" width="30" height="4" rx="1.5" fill="#1e293b"/>
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(186, 91)">
      <rect x="-3" y="0" width="26" height="6" rx="2" fill="url(#transGoldBevel)"/>
      <rect x="0" y="5" width="20" height="64" rx="3" fill="url(#transPillarCylinder)"/>
      <line x1="10" y1="6" x2="10" y2="68" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
      <rect x="-3" y="68" width="26" height="7" rx="2" fill="url(#transGoldBevel)"/>
      <rect x="-5" y="74" width="30" height="4" rx="1.5" fill="#1e293b"/>
    </g>

    <!-- Welcoming Center Arched Gateway of MPP -->
    <path d="M 112 165 L 112 118 C 112 104, 144 104, 144 118 L 144 165 Z" fill="#020817"/>
    <path d="M 114 165 L 114 120 C 114 108, 142 108, 142 120 L 142 165 Z" fill="url(#transPortalGlow)"/>
    <circle cx="128" cy="122" r="7" fill="#fef08a" opacity="0.95"/>

    <!-- 3-Tiered 3D Pedestal Base / Steps -->
    <rect x="32" y="168" width="192" height="8" rx="2" fill="url(#transPillarCylinder)"/>
    <line x1="33" y1="169" x2="223" y2="169" stroke="#ffffff" stroke-width="1.8"/>
    <rect x="26" y="176" width="204" height="9" rx="2.5" fill="#334155"/>
    <line x1="27" y1="177" x2="229" y2="177" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="20" y="184" width="216" height="11" rx="3" fill="#0f172a"/>
  </g>

  <!-- 3D "MPP" Monogram Plaque at Bottom -->
  <g transform="translate(128, 208)">
    <rect x="-76" y="-14" width="152" height="38" rx="19" fill="#020617" opacity="0.45"/>
    <rect x="-76" y="-17" width="152" height="36" rx="18" fill="#451a03"/>
    <rect x="-74" y="-19" width="148" height="36" rx="18" fill="#030818" stroke="url(#transGoldBevel)" stroke-width="2.5"/>
    <rect x="-71" y="-17" width="142" height="16" rx="8" fill="#ffffff" opacity="0.18"/>
    
    <text x="0" y="8" 
          font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" 
          font-size="23" 
          font-weight="900" 
          letter-spacing="5" 
          text-anchor="middle" 
          fill="#1c0a02">
      MPP
    </text>
    <text x="0" y="6" 
          font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" 
          font-size="23" 
          font-weight="900" 
          letter-spacing="5" 
          text-anchor="middle" 
          fill="#92400e">
      MPP
    </text>
    <text x="0" y="4" 
          font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" 
          font-size="23" 
          font-weight="900" 
          letter-spacing="5" 
          text-anchor="middle" 
          fill="url(#transGoldLight)">
      MPP
    </text>
  </g>

  <!-- Golden 3D Shimmer Sparkles -->
  <polygon points="46,38 48,43 53,44 48,46 46,51 44,46 39,44 44,43" fill="#fef08a" opacity="0.95"/>
  <polygon points="210,38 212,43 217,44 212,46 210,51 208,46 203,44 208,43" fill="#fef08a" opacity="0.95"/>
</svg>
