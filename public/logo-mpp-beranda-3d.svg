<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 12 100 98" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold 3D -->
    <linearGradient id="goldMpp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Pillar Marble Gradient -->
    <linearGradient id="pillarMpp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Portal Glow -->
    <radialGradient id="portalGlowBeranda" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>

  <!-- PURE TRANSPARENT BACKGROUND (No rectangular plaque container) -->
  <g transform="translate(0, 0)">
    <!-- 3D Gold Pediment Roof -->
    <polygon points="60,18 100,43 20,43" fill="#451a03"/>
    <polygon points="60,16 98,41 22,41" fill="url(#goldMpp)"/>
    <line x1="60" y1="16" x2="22" y2="41" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Inset Triangle -->
    <polygon points="60,22 90,39 30,39" fill="#0f2b6b" stroke="url(#goldMpp)" stroke-width="1.2"/>

    <!-- Star Emblem in Pediment -->
    <polygon points="60,25 61.8,30 67,30.5 63,33.5 64.5,38.5 60,35.5 55.5,38.5 57,33.5 53,30.5 58.2,30" fill="#fde047"/>

    <!-- Architrave Beam -->
    <rect x="18" y="41" width="84" height="6" rx="1.5" fill="url(#goldMpp)"/>
    <line x1="19" y1="42" x2="101" y2="42" stroke="#ffffff" stroke-width="1.2" opacity="0.9"/>

    <!-- 4 White 3D Pillars -->
    <rect x="25" y="47" width="9" height="34" rx="1.5" fill="url(#pillarMpp)"/>
    <line x1="29.5" y1="48" x2="29.5" y2="80" stroke="#ffffff" stroke-width="1" opacity="0.8"/>

    <rect x="44" y="47" width="9" height="34" rx="1.5" fill="url(#pillarMpp)"/>
    <line x1="48.5" y1="48" x2="48.5" y2="80" stroke="#ffffff" stroke-width="1" opacity="0.8"/>

    <rect x="67" y="47" width="9" height="34" rx="1.5" fill="url(#pillarMpp)"/>
    <line x1="71.5" y1="48" x2="71.5" y2="80" stroke="#ffffff" stroke-width="1" opacity="0.8"/>

    <rect x="86" y="47" width="9" height="34" rx="1.5" fill="url(#pillarMpp)"/>
    <line x1="90.5" y1="48" x2="90.5" y2="80" stroke="#ffffff" stroke-width="1" opacity="0.8"/>

    <!-- Door / Center Entrance with Welcoming Portal -->
    <path d="M 53 81 L 53 60 Q 60 54 67 60 L 67 81 Z" fill="#0f172a"/>
    <path d="M 54 81 L 54 61 Q 60 56 66 61 L 66 81 Z" fill="url(#portalGlowBeranda)"/>
    <circle cx="60" cy="62" r="2.8" fill="#fef08a"/>

    <!-- 3D Steps -->
    <rect x="16" y="80" width="88" height="5" rx="1.5" fill="url(#pillarMpp)"/>
    <rect x="12" y="84" width="96" height="6" rx="2" fill="#1e293b"/>
  </g>

  <!-- 3D "MPP" Monogram Pill at Bottom -->
  <g transform="translate(60, 98)">
    <rect x="-30" y="-8" width="60" height="17" rx="8.5" fill="#0b1736" stroke="url(#goldMpp)" stroke-width="1.5"/>
    <text x="0" y="4" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="11" 
          font-weight="900" 
          letter-spacing="2.5" 
          text-anchor="middle" 
          fill="url(#goldMpp)">
      MPP
    </text>
  </g>
</svg>
