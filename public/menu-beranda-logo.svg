<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Beranda: Vibrant Royal Blue & Azure -->
    <linearGradient id="berandaMppBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="40%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Metallic Gold 3D -->
    <linearGradient id="goldMpp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Pillar Marble Gradient -->
    <linearGradient id="pillarMpp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <filter id="berandaDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#020617" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 3D Beveled Plaque Container -->
  <g filter="url(#berandaDropShadow)">
    <rect x="6" y="6" width="108" height="108" rx="28" fill="#091b3e"/>
    <rect x="7" y="7" width="106" height="106" rx="26" fill="url(#berandaMppBg)"/>
    <rect x="8.5" y="8.5" width="103" height="103" rx="24.5" fill="none" stroke="url(#goldMpp)" stroke-width="2" opacity="0.95"/>
    <path d="M 12 30 Q 60 12 108 30 L 108 55 Q 60 42 12 55 Z" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- 3D MPP Facade -->
  <g transform="translate(0, 0)">
    <!-- 3D Gold Pediment Roof -->
    <polygon points="60,18 100,43 20,43" fill="#78350f"/>
    <polygon points="60,16 98,41 22,41" fill="url(#goldMpp)"/>
    <!-- Inset Triangle -->
    <polygon points="60,22 90,39 30,39" fill="#1e3a8a"/>

    <!-- Star Emblem in Pediment -->
    <polygon points="60,25 61.8,30 67,30.5 63,33.5 64.5,38.5 60,35.5 55.5,38.5 57,33.5 53,30.5 58.2,30" fill="#fef08a"/>

    <!-- Architrave Beam -->
    <rect x="18" y="41" width="84" height="6" rx="1.5" fill="url(#goldMpp)"/>

    <!-- 4 White 3D Pillars -->
    <rect x="25" y="47" width="9" height="34" rx="1.5" fill="url(#pillarMpp)"/>
    <rect x="44" y="47" width="9" height="34" rx="1.5" fill="url(#pillarMpp)"/>
    <rect x="67" y="47" width="9" height="34" rx="1.5" fill="url(#pillarMpp)"/>
    <rect x="86" y="47" width="9" height="34" rx="1.5" fill="url(#pillarMpp)"/>

    <!-- Door / Center Entrance with Welcoming Portal -->
    <path d="M 53 81 L 53 60 Q 60 54 67 60 L 67 81 Z" fill="#0f172a"/>
    <circle cx="60" cy="59" r="2.5" fill="#38bdf8"/>

    <!-- 3D Steps -->
    <rect x="16" y="80" width="88" height="5" rx="1.5" fill="url(#pillarMpp)"/>
    <rect x="12" y="84" width="96" height="6" rx="2" fill="#334155"/>
  </g>

  <!-- 3D "MPP" Monogram Pill at Bottom -->
  <g transform="translate(60, 100)">
    <rect x="-36" y="-10" width="72" height="18" rx="9" fill="#0b1736" stroke="url(#goldMpp)" stroke-width="1.5"/>
    <text x="0" y="3" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="13" 
          font-weight="900" 
          letter-spacing="3" 
          text-anchor="middle" 
          fill="url(#goldMpp)">
      MPP
    </text>
  </g>
</svg>
